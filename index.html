<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delivery Hub - Status</title>
<style>
body{margin:0;padding:18px 16px 40px;background:#121212;color:#f2f2f2;font:15px/1.5 system-ui,Arial,sans-serif}
h1{font-size:21px;margin:0 0 6px}
.ok{color:#4ade80}.bad{color:#f87171}.warn{color:#fbbf24}
.row{padding:9px 0;border-bottom:1px solid #2b2b2b;word-break:break-word}
.todo{margin:14px 0 0;padding:14px;border-radius:12px;background:#3b1d1d;color:#fff;font-weight:600}
.good{background:#12351f}
button,a.btn{display:block;width:100%;box-sizing:border-box;text-align:center;margin:12px 0 0;padding:15px;border:0;border-radius:12px;background:#ff4d00;color:#fff;font:600 15px system-ui,Arial,sans-serif;text-decoration:none}
button.sec,a.btn.sec{background:#333}
small{color:#9a9a9a}
#msg{margin-top:12px;color:#4ade80}
</style>
</head>
<body>
<h1>Delivery Hub status</h1>
<div class="ok">&#9989; This page loaded, so your hosting works.</div>
<small id="when"></small>
<div id="out"><div class="row">Checking your files...</div></div>
<div id="todo"></div>
<button id="fix" onclick="resetApp(false)">Fix: clear cache + service worker, then open app</button>
<button class="sec" onclick="resetApp(true)">Same, and also log me out</button>
<a class="btn sec" href="/">Open the app</a>
<div id="msg"></div>
<script>
var EXP_SINGLE = 154287;
var EXP_MULTI = 50226;
// Search words are split in two so this page never matches its own source code
var M_SELF = 'Delivery Hub ' + '- Status';
var M_BUILD = 'DH_INDEX_' + "BUILD = '";
var M_APP = 'function go' + 'Home';
var M_END = 'DH_FILE_' + 'END';
var M_SCRIPT = '<script src="' + 'app.js';

var out = document.getElementById('out');
var fixes = [];
function add(cls, text, fix) {
  var d = document.createElement('div');
  d.className = 'row ' + cls;
  d.textContent = (cls === 'ok' ? '\u2705 ' : cls === 'bad' ? '\u274C ' : '\u26A0\uFE0F ') + text;
  out.appendChild(d);
  if (cls === 'bad' && fix && fixes.indexOf(fix) === -1) fixes.push(fix);
}
function get(url) {
  return fetch(url + (url.indexOf('?') > -1 ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' }).then(function(r) {
    return r.text().then(function(t) { return { status: r.status, type: r.headers.get('content-type') || '', text: t }; });
  });
}
function nbytes(s) { return new Blob([s]).size; }
function nlines(s) { return s.split('\n').length - 1; }
function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
document.getElementById('when').textContent = new Date().toString();

function checkIndex() {
  return get('/index.html').then(function(r) {
    var t = r.text, b = nbytes(t);
    add(r.status === 200 ? 'ok' : 'bad', 'index.html on the server: HTTP ' + r.status + ', ' + fmt(b) + ' bytes, ' + nlines(t) + ' lines', 'Upload index.html to the top level of your GitHub repo.');
    if (t.indexOf(M_SELF) > -1) {
      add('bad', 'The file called index.html on your server is THIS STATUS PAGE, not the app. The real app was never uploaded.', 'Upload the REAL index.html (about ' + fmt(EXP_SINGLE) + ' bytes, from delivery-hub-single-file.zip) over it. Keep status.html as a separate file.');
      return;
    }
    var bi = t.indexOf(M_BUILD);
    var build = bi > -1 ? t.substr(bi + M_BUILD.length).split("'")[0] : null;
    var inline = t.indexOf(M_APP) > -1;
    var ext = t.indexOf(M_SCRIPT) > -1;
    var hasEnd = t.indexOf(M_END) > -1;
    var complete = /<\/html>\s*$/i.test(t) && hasEnd;
    add(complete ? 'ok' : 'bad', complete ? 'index.html is complete.' : 'index.html is CUT OFF or damaged (the end of the file is missing).', 'Upload index.html again. Use the file from the ZIP, not a copy that was opened and pasted.');
    add(build ? 'ok' : 'warn', 'Build inside index.html: ' + (build || 'not found (an old index.html?)'));
    if (inline) {
      add('ok', 'The app code is inside index.html (single-file version). No app.js needed.');
      var same = b === EXP_SINGLE;
      add(same ? 'ok' : 'bad', same ? 'index.html has exactly the expected size.' : 'index.html should be ' + fmt(EXP_SINGLE) + ' bytes but the server has ' + fmt(b) + '.', 'Upload index.html again from the ZIP (expected size ' + fmt(EXP_SINGLE) + ' bytes).');
      return;
    }
    if (!ext) { add('bad', 'index.html contains no app code and no link to app.js.', 'Upload the real index.html from delivery-hub-single-file.zip.'); return; }
    var sameM = b === EXP_MULTI;
    add(sameM ? 'ok' : 'warn', sameM ? 'index.html (two-file version) has the expected size.' : 'index.html (two-file version) should be ' + fmt(EXP_MULTI) + ' bytes, server has ' + fmt(b) + '.');
    var ex = /DH_EXPECT = \{ lines: (\d+), bytes: (\d+) \}/.exec(t);
    return get('/app.js').then(function(a) {
      var ab = nbytes(a.text), al = nlines(a.text);
      add(a.status === 200 ? 'ok' : 'bad', 'app.js: HTTP ' + a.status + ', ' + fmt(ab) + ' bytes, ' + al + ' lines', 'Upload app.js next to index.html.');
      if (a.text.charAt(0) === '<') add('bad', 'The server sent a web page instead of JavaScript for app.js. app.js is missing or has the wrong name.', 'Upload app.js (exact name, lowercase) at the top level of the repo.');
      if (ex) {
        var ok = ab === parseInt(ex[2], 10) && al === parseInt(ex[1], 10);
        add(ok ? 'ok' : 'bad', ok ? 'app.js has exactly the expected size.' : 'app.js should be ' + fmt(ex[2]) + ' bytes and ' + ex[1] + ' lines but the server has ' + fmt(ab) + ' bytes and ' + al + ' lines.', 'Upload app.js again from the ZIP. The copy on the server is old or damaged.');
      }
    });
  });
}

function checkFile(path, test, hint) {
  return get(path).then(function(r) {
    var good = r.status === 200 && test(r);
    add(good ? 'ok' : 'warn', path + ': ' + (good ? 'OK' : (r.status === 200 ? 'present but not the right file' : 'HTTP ' + r.status) + ' (' + hint + ')'));
  });
}

function run() {
  out.innerHTML = '';
  checkIndex().then(function() {
    return checkFile('/manifest.json', function(r) { return r.text.indexOf('"name"') > -1; }, 'missing: only needed to install the app on the home screen');
  }).then(function() {
    return checkFile('/sw.js', function(r) { return r.text.indexOf('addEventListener') > -1; }, 'optional: offline support');
  }).then(function() {
    return checkFile('/icon-192.png', function(r) { return r.type.indexOf('image') > -1; }, 'optional: app icon');
  }).then(function() {
    var jobs = [];
    if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs) { add(rs.length ? 'warn' : 'ok', 'Service workers on this phone: ' + rs.length + (rs.length ? ' (an old one can show a stale or black page; use the Fix button)' : '')); }));
    if (window.caches) jobs.push(caches.keys().then(function(ks) { add(ks.length ? 'warn' : 'ok', 'Cached copies on this phone: ' + ks.length + (ks.length ? ' (' + ks.join(', ') + ')' : '')); }));
    return Promise.all(jobs);
  }).catch(function(e) {
    add('bad', 'Check failed: ' + e.message, 'Check your internet and reload this page.');
  }).then(function() {
    var t = document.getElementById('todo');
    if (fixes.length) {
      t.className = 'todo';
      t.textContent = '\uD83D\uDC49 Do this next: ' + fixes[0];
    } else {
      t.className = 'todo good';
      t.textContent = '\u2705 Your files look right. Tap the orange Fix button once, then the app will open.';
    }
  });
}

function resetApp(full, noGo) {
  var jobs = [];
  if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs) { return Promise.all(rs.map(function(r) { return r.unregister(); })); }));
  if (window.caches) jobs.push(caches.keys().then(function(ks) { return Promise.all(ks.map(function(k) { return caches.delete(k); })); }));
  if (full) {
    try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
    try {
      if (indexedDB.databases) jobs.push(indexedDB.databases().then(function(dbs) { dbs.forEach(function(d) { indexedDB.deleteDatabase(d.name); }); }));
      else indexedDB.deleteDatabase('firebaseLocalStorageDb');
    } catch (e) {}
  }
  document.getElementById('msg').textContent = 'Cleaning...';
  return Promise.all(jobs).catch(function() {}).then(function() {
    document.getElementById('msg').textContent = 'Done. Opening the app...';
    if (!noGo) setTimeout(function() { location.href = '/?fresh=' + Date.now(); }, 500);
  });
}
run();
</script>
</body>
</html>
